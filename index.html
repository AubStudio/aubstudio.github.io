<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AUB Studio</title>
  <meta name="description" content="AUB Studio makes mobile games. Play ToyBop on Google Play.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <meta property="og:title" content="AUB Studio">
  <meta property="og:description" content="AUB Studio makes mobile games. Play ToyBop on Google Play.">
  <meta property="og:image" content="https://aubstudio.github.io/assets/aub-studio.png">
  <link rel="icon" href="assets/aub-studio.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap">
  <style>
    :root {
      --bg: #000000;
      --surface: #141414;
      --line: #2a2a2a;
      --text: #ffffff;
      --muted: #a8a8a8;
      --orange: #ff7a0a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 500 17px/1.6 Montserrat, system-ui, sans-serif;
    }

    img { display: block; max-width: 100%; height: auto; }
    a { color: inherit; }
    a:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }

    .wrap { max-width: 960px; margin: 0 auto; padding: 0 16px; }

    header { padding-top: 24px; text-align: center; }

    /* The logo file has wide black margins, which blend into the page. */
    .logo {
      width: min(420px, 90vw);
      aspect-ratio: 2 / 1;
      margin: 0 auto;
      object-fit: cover;
    }

    header p { margin: 0; color: var(--muted); }

    h2, h3 { margin: 0; font-weight: 800; line-height: 1.2; letter-spacing: -.01em; }

    .eyebrow {
      margin: 72px 0 16px;
      color: var(--orange);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .game {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--surface);
    }

    .banner {
      width: 100%;
      height: clamp(200px, 42vw, 420px);
      object-fit: cover;
      object-position: center 30%;
    }

    .info { display: flex; gap: 20px; align-items: center; padding: 24px; }

    .icon { flex: none; width: 96px; height: 96px; border-radius: 22px; }

    .text { flex: 1; min-width: 0; }

    h2 { font-size: 32px; }

    .text p { margin: 4px 0 0; color: var(--muted); }

    .play {
      flex: none;
      padding: 14px 22px;
      border-radius: 12px;
      background: var(--orange);
      color: #000;
      font-weight: 800;
      text-decoration: none;
      transition: background .15s;
    }

    .play:hover { background: #ff9436; }

    .phones {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(8px, 2.5vw, 24px);
      margin: 24px 0 0;
      padding: 0;
      list-style: none;
    }

    .phones img {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: clamp(10px, 2.5vw, 20px);
    }

    footer {
      margin-top: 72px;
      padding: 32px 0 40px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 15px;
    }

    footer .wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 24px;
      justify-content: space-between;
    }

    footer nav { display: flex; flex-wrap: wrap; gap: 8px 24px; }
    footer a:hover { color: var(--text); }

    @media (max-width: 640px) {
      .info { flex-wrap: wrap; }
      .icon { width: 72px; height: 72px; border-radius: 16px; }
      .text { flex-basis: calc(100% - 92px); }
      .play { width: 100%; text-align: center; }
      h2 { font-size: 26px; }
      .eyebrow { margin-top: 48px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .play { transition: none; }
    }
  </style>
</head>
<body>
  <header class="wrap">
    <h1 style="margin:0"><img class="logo" src="assets/aub-studio.png" width="512" height="512" alt="AUB Studio"></h1>
    <p>We make mobile games.</p>
  </header>

  <main class="wrap">
    <p class="eyebrow">Our game</p>
    <article class="game">
      <img class="banner" src="assets/toybop-banner.jpg" width="1600" height="800" alt="A big pile of colorful plush toys under a blue sky, with gift boxes and stars flying around it">
      <div class="info">
        <img class="icon" src="assets/toybop-icon.png" width="96" height="96" alt="ToyBop app icon">
        <div class="text">
          <h2>ToyBop</h2>
          <p>Pick the right gift boxes, pack the plush toys and clear the pile.</p>
        </div>
        <a class="play" href="https://play.google.com/store/apps/details?id=com.aubstudio.toybop">Get it on Google Play</a>
      </div>
    </article>

    <ul class="phones">
      <li><img src="assets/toybop-title.jpg" width="480" height="1042" loading="lazy" alt="ToyBop title screen"></li>
      <li><img src="assets/toybop-play.jpg" width="480" height="1042" loading="lazy" alt="A level in play, with plush toys above rows of gift boxes"></li>
      <li><img src="assets/toybop-win.jpg" width="480" height="1042" loading="lazy" alt="Level complete screen with three gold stars"></li>
    </ul>
  </main>

  <footer>
    <div class="wrap">
      <span>&copy; 2026 AUB Studio</span>
      <nav>
        <a href="https://aubstudio.github.io/web-toybop/privacy-policy.html">ToyBop Privacy Policy</a>
        <a href="mailto:aub.indiegame@gmail.com">aub.indiegame@gmail.com</a>
      </nav>
    </div>
  </footer>
</body>
</html>
