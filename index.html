<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AubStudio</title>
  <style>
    :root { --bg: #fff; --text: #1f2328; --muted: #656d76; --link: #0969da; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --text: #e6edf3; --muted: #8b949e; --link: #4493f8; } }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 64px 16px; }
    h1 { margin: 0; font-size: 32px; }
    h2 { margin: 40px 0 8px; font-size: 20px; }
    p { margin: 8px 0; color: var(--muted); }
    a { color: var(--link); }
  </style>
</head>
<body>
  <main>
    <h1>AubStudio</h1>
    <p>Mobile games.</p>

    <h2>ToyBop</h2>
    <p><a href="https://play.google.com/store/apps/details?id=com.aubstudio.toybop">Get it on Google Play</a></p>
    <p><a href="https://aubstudio.github.io/web-toybop/privacy-policy.html">Privacy Policy</a></p>

    <h2>Contact</h2>
    <p><a href="mailto:aub.indiegame@gmail.com">aub.indiegame@gmail.com</a></p>
  </main>
</body>
</html>
